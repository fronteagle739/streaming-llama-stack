<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <!-- DSV4.1 single-machine launcher: one robot riding a stylised river. Drawn for this repo. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a66"/>
      <stop offset="1" stop-color="#0b1f3a"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#sky)"/>
  <!-- river: one broad band flowing from top-left to bottom-right -->
  <path d="M8 150 C60 112 100 178 150 150 S220 120 248 150 L248 248 L8 248 Z" fill="#1f9fe0"/>
  <path d="M8 182 C60 146 104 210 154 182 S220 152 248 182 L248 248 L8 248 Z" fill="#46c3f2"/>
  <path d="M30 210 C70 188 104 226 150 208 S206 190 232 204" fill="none" stroke="#c8f1ff"
        stroke-width="9" stroke-linecap="round"/>
  <!-- raft -->
  <path d="M74 158 L182 158 L170 176 L86 176 Z" fill="#ff8a3d" stroke="#0b1f3a" stroke-width="6"
        stroke-linejoin="round"/>
  <!-- robot -->
  <line x1="128" y1="58" x2="128" y2="38" stroke="#e8edf5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="128" cy="34" r="10" fill="#ff8a3d" stroke="#0b1f3a" stroke-width="4"/>
  <rect x="92" y="56" width="72" height="58" rx="16" fill="#f4f7fb" stroke="#0b1f3a" stroke-width="6"/>
  <circle cx="113" cy="84" r="9" fill="#1f9fe0"/>
  <circle cx="143" cy="84" r="9" fill="#1f9fe0"/>
  <rect x="102" y="114" width="52" height="44" rx="10" fill="#dfe6f0" stroke="#0b1f3a" stroke-width="6"/>
  <rect x="117" y="126" width="22" height="14" rx="4" fill="#ff8a3d"/>
  </g>
</svg>
