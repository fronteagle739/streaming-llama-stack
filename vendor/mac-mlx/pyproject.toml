[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-vlm"
dynamic = ["version", "dependencies"]
description = "MLX-VLM is a package for inference and fine-tuning of Vision Language Models (VLMs) and Omni Models (VLMs with audio and video support) on your Mac using MLX."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Prince Canuma", email = "prince.gdt@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Blaizzy/mlx-vlm"
Repository = "https://github.com/Blaizzy/mlx-vlm"
Issues = "https://github.com/Blaizzy/mlx-vlm/issues"

[project.scripts]
"mlx_vlm.chat_ui" = "mlx_vlm.chat_ui:main"
"mlx_vlm.chat" = "mlx_vlm.chat:main"
"mlx_vlm.convert" = "mlx_vlm.convert:main"
"mlx_vlm.generate" = "mlx_vlm.generate:main"
"mlx_vlm.server" = "mlx_vlm.server:main"

[tool.setuptools.packages.find]
include = ["mlx_vlm*"]
exclude = ["mlx_vlm.tests*"]

[tool.setuptools.dynamic]
version = {attr = "mlx_vlm.version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"mlx_vlm.custom_kernels.glm_moe_dsa" = ["README.md", "csrc/*.cpp", "csrc/*.h", "csrc/*.txt", "csrc/*.metal", "csrc/kernels/*.h", "csrc/mlx/backend/metal/kernels/steel/attn/*.h"]
"mlx_vlm.custom_kernels.deepseek_v41" = ["*.metal", "V41_KERNELS_NOTICE.md", "V41_KERNELS_MIT_LICENSE.txt"]
"mlx_vlm.models.deepseek_v41" = ["OMLX_*LICENSE.txt", "OMLX_HEAD_NOTICE.md"]
"mlx_vlm.models.mimo_v2" = ["_arch_v26.LICENSE"]

[project.optional-dependencies]
ui = ["gradio>=5.19.0"]
cuda = ["mlx-cuda"]
cpu = ["mlx-cpu"]
mimo-media = ["torch>=2.6", "torchvision>=0.21", "torchaudio>=2.6", "soundfile>=0.13", "av>=14"]
